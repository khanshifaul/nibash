name: nibash

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: nibash
      POSTGRES_PASSWORD: nibash_dev_password
      POSTGRES_DB: nibash
    ports:
      - "5435:5432"
    volumes:
      - nibash-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibash -d nibash"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nibash
      MINIO_ROOT_PASSWORD: nibash_dev_password
    ports:
      - "9001:9000"
      - "9002:9001"
    volumes:
      - nibash-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nibash nibash_dev_password;
      mc mb -p local/nibash-storage || true;
      mc anonymous set download local/nibash-storage || true;
      exit 0;
      "
    restart: "no"

volumes:
  nibash-pgdata:
  nibash-minio-data:
