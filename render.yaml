# render.yaml — Render Blueprint for nibash (API on Render; web recommended on Vercel).
# Deploy: connect repo in Render → Blueprints → New Blueprint Instance.
# Set all sync:false env vars in Render dashboard. For production cross-origin auth
# (Vercel web + Render API) cookies use SameSite=None; Secure (see cookie.util.ts).
services:
  - type: web
    name: nibash-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # Neon/Supabase Postgres connection string
      - key: DIRECT_URL
        sync: false # optional direct (non-pooled) URL for migrations
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: 30
      - key: APP_URL
        sync: false # https://<api-service>.onrender.com
      - key: WEB_ORIGIN
        sync: false # https://<your-vercel-app>.vercel.app (exact origin, no trailing slash)
      - key: GOOGLE_CLIENT_ID
        sync: false # optional — enables Google sign-in
      - key: GOOGLE_CLIENT_SECRET
        sync: false # optional — server-side only
      - key: GOOGLE_CALLBACK_URL
        sync: false # optional — https://<api-service>.onrender.com/auth/google/callback
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false # e.g. "Nibash <noreply@yourdomain.com>" (verified in Resend)
      - key: STORAGE_ENDPOINT
        sync: false # R2: https://<accountid>.r2.cloudflarestorage.com
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false # public bucket/CDN base URL
